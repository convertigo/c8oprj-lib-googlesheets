↓ParseConfigAndFilters [steps.SimpleStep-1723789002819]: 
  expression: |
    'forms_config = JSON.parse(forms_config);
    try {
    	if (forms_tableFilter.length != 0)
    	  	forms_tableFilter = JSON.parse(forms_tableFilter) 
    	 
    	log.warn("Filters are : " + JSON.stringify(forms_tableFilter));
    	
    	// Build a Query from the filters in google Query Language . filters are in this format :
    	/*	
    		This is an example of a Forms filter object :
    	    "filters": [
    	        {
    	            "field": "Description",
    	            "op": "contains",
    	            "value": ""
    	        },
    	        {
    	            "field": "Qty",
    	            "op": "equal",
    	            "value": "TEST"
    	        },
    	        {
    	            "field": "Price",
    	            "op": "not_equal",
    	            "value": "TEST"
    	        },
    	        {
    	            "field": "Price",
    	            "op": "greater",
    	            "value": "TEST"
    	        },
    	        {
    	            "field": "Date Purchased",
    	            "op": "minus"
    	        },
    	        {
    	            "field": "Price Cputed",
    	            "op": "minusequals"
    	        },
    	        {
    	            "field": "Price Cputed",
    	            "op": "greaterequals"
    	        },
    	        {
    	            "field": "Description",
    	            "op": "is_empty"
    	        },
    	        {
    	            "field": "Description",
    	            "op": "not_contains"
    	        },
    	        {
    	            "field": "Description",
    	            "op": "is_filled"
    	        },
    	        {
    	            "field": "Description",
    	            "op": "among_following"
    	        },
    	        {
    	            "field": "Description",
    	            "op": "out_following"
    	        }
    	    ],
    	    "mode": "OR"
    	}
    
    	Queries must be in This format :
    	SELECT * WHERE Col"&XMATCH("Description"; ''Feuille 1''!A1:F1)&" CONTAINS(''Element1'')"
    
    	 
    	*/
    	
    	Query = null;
    	
    	if (forms_tableFilter.filters.length != 0) {
    		Query = "SELECT * WHERE ";
    		parsedRange = extractRangeDetails(forms_config.range)
    		colRange = parsedRange.sheetName  + parsedRange.firstCol + parsedRange.firstRow + ":" + parsedRange.lastCol + parsedRange.firstRow;
    		
    		for (var i = 0; i < forms_tableFilter.filters.length; i++) {
    			if (i != 0) {
    				Query += " " + forms_tableFilter.mode + " ";
    			}
    			
    			// $$$SheetName$$$ will replaced with the real sheet name by the SheetGetRange Sequence as it acess acess to the Google Sheet API
    			Query += ''Col"&XMATCH("'' + forms_tableFilter.filters[i].field + ''"; '' + ''$$$SheetName$$$'' + colRange + '')&" ''
    			
    			switch (forms_tableFilter.filters[i].op) {
    				case "contains":
    					Query += "CONTAINS ''" + forms_tableFilter.filters[i].value + "'' ";
    					break;
    					
    				case "equal":
    					Query += "= " + forms_tableFilter.filters[i].value;
    					break;
    					
    				case "not_equal":
    					Query += "!= " + forms_tableFilter.filters[i].value;
    					break;
    					
    				case "greater":
    					Query += "> " + forms_tableFilter.filters[i].value;
    					break;
    					
    				case "minus":
    					Query += "< " + forms_tableFilter.filters[i].value;
    					break;
    					
    				case "minusequals":
    					Query += "<= " + forms_tableFilter.filters[i].value;
    					break;
    					
    				case "greaterequals":
    					Query += ">= " + forms_tableFilter.filters[i].value;
    					break;
    					
    				case "is_empty":
    					Query += "IS NULL"
    					break;
    					
    				case "not_contains":
    					Query += "CONTAINS(''" + forms_tableFilter.filters[i].value + "'') ";
    					break;
    					
    				case "is_filled":
    					Query += "IS NOT NULL"
    					break;
    					
    				case "among_following":
    					Query += "IN (" + forms_tableFilter.filters[i].value + ") ";
    					break;
    					
    				case "out_following":
    					Query += "NOT IN (" + forms_tableFilter.filters[i].value + ") ";
    					break;
    			} 
    		}
    	}
    	// log.warn("Query  : " + Query);
    }
    catch (e) {
    	log.warn("No filters");
    	forms_tableFilter = null
    	Query = null;
    }
    
    
    function extractRangeDetails(range) {
      // Regular expression to match the optional sheet name and the range
      const rangeRegex = /''?([^'']*)''?!?([A-Z]{1,2})(\d+):([A-Z]{1,2})/;
    
      const match = range.match(rangeRegex);
    
      if (match) {
        const sheetName = match[1] || null;
        const firstCol = match[2];
        const firstRow = match[3];
        const lastCol = match[4];
    
        return {
          sheetName: sheetName ? sheetName + "!" : "",
          firstCol: firstCol,
          firstRow: parseInt(firstRow, 10),
          lastCol: lastCol
        };
      } else {
        throw new Error("Invalid range format");
      }
    }
    
    '
