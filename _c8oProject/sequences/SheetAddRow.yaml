    				ExecSheetId = Sheets.getSheets().get(i).getProperties().getSheetId();
    				break;
    			}
    		}
    	
    	    // Do we already have this Sheet ? if not add it .. 
    	    if (ExecSheetId == null) {						
    			// Create a request to add a new sheet
    	    	let addSheetRequest = new AddSheetRequest().setProperties(
    	        	new com.google.api.services.sheets.v4.model.SheetProperties().setTitle("C8OQueryExecutor")
    	    	);
    	        
    	        // Create a batch update request
    	    	let requests = new ArrayList();
    	    	requests.add(new Request().setAddSheet(addSheetRequest));
    	    	let batchUpdateRequest = new com.google.api.services.sheets.v4.model.BatchUpdateSpreadsheetRequest().setRequests(requests);
    	    	// Execute the request
    	    	service.spreadsheets().batchUpdate(SheetID, batchUpdateRequest).execute();
    	    	// Set a flag that we added an executionSheet
    	    	bExecSheetAdded = true;
    		}
    	}
    }
    
