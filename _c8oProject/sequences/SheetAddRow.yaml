    function extractRangeDetails(range) {
      // Regular expression to match the optional sheet name and the range
      const rangeRegex = /''?([^'']*)''?!?([A-Z]{1,2})(\d+):([A-Z]{1,2})(\d+)/;
    
      const match = range.match(rangeRegex);
    
      if (match) {
        const sheetName = match[1] || null;
        const firstCol = match[2];
        const firstRow = match[3];
        const lastCol = match[4];
        const lastRow = match[5];
    
        return {
          sheetName: sheetName ? "''" + sheetName + "''!" : "",
          firstCol: firstCol,
          firstRow: parseInt(firstRow, 10),
          lastCol: lastCol,
          lastRow: parseInt(lastRow, 10)
        };
      } else {
        throw new Error("Invalid range format");
      }
    }
    
    function getSheetColumns(sheetId, range) {
    	// Get the Google Sheet column names
    	
    	headerRange = extractRangeDetails(Range)
    	headerRange =	headerRange.sheetName + 
    					headerRange.firstCol +
    					headerRange.firstRow + ":" + 
    					headerRange.lastCol + 
    					headerRange.firstRow;
    					
    	log.debug("[Google Sheet Connector] Header range is : <" + headerRange + ">");
    					
    	response = service.spreadsheets().values()
    	    .get(SheetID, headerRange)
    	    .execute();		
    	
    	values = response.getValues();
    	if (values == null || values.isEmpty()) {
    		log.warn("[Google Sheet Connector] no data found in the header row");
    	} else {
    		headers = values[0].toArray();		
    	}
    	return headers;
    }
    
    function extractContentBetweenOuterSingleQuotes(inputString) {
        // Regular expression to match content between the first and last single quotes
        const regex = /''([^'']*(?:''[^'']*)*)''/;
        const match = regex.exec(inputString);
    
        // If a match is found, return the content between the quotes
        if (match) {
            return match[1];
        }
    
        // Return an empty string if no match is found
    	log.warn("[Google Sheet Connector] No quotes was provided surrounding the value : " + inputString);
        return '''';
    }
    
    /**
