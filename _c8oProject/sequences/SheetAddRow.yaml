    /**
     * Parse the update Statement from a string of this syntax
     * 
     * inputText5 = ''ZZZ'', inputText3 = ''UUU''
     * 
     * Return an array of field / value objects.. 
     * 
     * Note : Parse handles Single quotes in field and values 
     */
    function ParseUpdate(input) {
        const result = [];
        const parts = input.split(/,(?=(?:[^'']*''[^'']*'')*[^'']*$)/);
    
        parts.forEach(part => {
            const regex = /([^=]+?)\s*=\s*''(.*)''/;
            const match = regex.exec(part.trim());
            if (match) {
                const field = match[1].trim();
                const value = match[2];
    	        // Push each matched field-value pair into the result array
    	        result.push({
    				field: field,
    				value: value
    			});
    		}
        })
        
       	log.debug("[Google Sheet Connector] Inputs : " + JSON.stringify(result));
        return result;
    }	
    
    /**
     * Compute Col from Header
     */
    function getColFromHeader(field, firstCol) {
    	// We have to find the column corresponding to the field
    	let column = -1;
    	for (let i=0; i<header.length; i++) {
    		if (header[i] == field) {
    			column = i;
    			break;
    		}
    	}
    
    	if (column == -1) {
    		log.error("[Google Sheet Connector] Field not found in the header row : " + field);
    		throw new Error("Field not found in the header row : " + field);
    	}
    
        // Set column to the corresponding letter in the Google Sheet corrected by the column found in the range
    	column = String.fromCharCode(65 + column + firstCol.charCodeAt(0) - 65);
    	return column
    }
    
    // Helper method to convert A1 notation to GridCoordinate
    function convertA1ToGridCoordinate(a1Notation, sheetId) {
        // Extract column and row from A1 notation
        const columnPart = a1Notation.replace(/[^A-Z]/g, "");
        const rowPart = a1Notation.replace(/[^0-9]/g, "");
    
        // Convert column to index (A=0, B=1, ..., Z=25, AA=26, etc.)
        let columnIndex = 0;
        for (let i = 0; i < columnPart.length; i++) {
            columnIndex = columnIndex * 26 + (columnPart.charCodeAt(i) - ''A''.charCodeAt(0) + 1);
        }
        columnIndex--; // Convert to 0-indexed
    
        // Convert row to index (1-indexed, so subtract 1)
        const rowIndex = parseInt(rowPart, 10) - 1;
    
        // Create and return the GridCoordinate object
    	with (GSheetAPI) {
    	    return new GridCoordinate().setSheetId(sheetId).setRowIndex(rowIndex).setColumnIndex(columnIndex);
    	}
    }
    
    function updateDiscontinuousCellsInRow(cellNotations, values, sheetName, spreadSheetID)  {
    	with (GSheetAPI) {
            // Prepare the requests for each cell
            requests = new ArrayList();
            
     		// Get Sheet ID
    		let sheetID = getSheetIdByName(spreadSheetID, sheetName)       
    
            // Example cells to update: A2, C2, E2 with respective values
            for (let i = 0; i < cellNotations.length; i++) {
                // Convert A1 notation to GridCoordinate
                gridCoordinate = convertA1ToGridCoordinate(cellNotations[i], sheetID, spreadSheetID);
    
                // Create the CellData
                cellData = new CellData()
                        .setUserEnteredValue(new ExtendedValue().setStringValue(values[i]));
    
                // Create UpdateCellsRequest for each cell
                updateCellsRequest = new UpdateCellsRequest()
                        .setStart(gridCoordinate)
                        .setRows(Arrays.asList(new RowData().setValues(Arrays.asList(cellData))))
                        .setFields("userEnteredValue");
    
                // Add the request to the list
                requests.add(new Request().setUpdateCells(updateCellsRequest));
            }
    
    
    		
            // Create the BatchUpdateSpreadsheetRequest
            batchUpdateRequest = new BatchUpdateSpreadsheetRequest()
                    .setRequests(requests);
    
            // Execute the batch update request
            service.spreadsheets().batchUpdate(spreadSheetID, batchUpdateRequest).execute();
        }
    }
     
    // Helper method to get the sheet ID by sheet name
    function getSheetIdByName(spreadsheetId, sheetName) {
    	// refresh the Sheet information...
    		sheetName = sheetName.replace(/[\''!]/g, "");
    		Sheets = service.spreadsheets().get(spreadsheetId).execute();
    		// Find the Sheet ID of the C8OQueryExecutor sheet
    		var SheetId = null;
    		for (let i = 0; i < Sheets.getSheets().size(); i++) {
    			if (Sheets.getSheets().get(i).getProperties().getTitle() == sheetName) {
    				SheetId = Sheets.getSheets().get(i).getProperties().getSheetId();
    				break;
    			}
    		}
    		return (SheetId)
    }
    
    
    /**
     * Parse a where clause in the form of expression field = value, field2 > value2, field3 < value3, etc  seprarated by AND
     * Operators supported are =, >, <, >=, <=
     * Return an array of objects with field and value and operator
     * 
     * @param {String} str the where clause
     * @returns {Object} the parsed where clause as a key value object
     * @example
     * 
     * var where = "field1 = value1 AND field2 > value2 AND field3 < value3";
     */
    
    function parseWhereWithOperator(whereClause) {
        const operators = [''='', ''>'', ''<'', ''>='', ''<=''];
        const logicalOperators = ['' AND '', '' OR ''];
    
        // Determine which logical operator is used in the clause
        const logicalOperatorUsed = logicalOperators.find(op => whereClause.includes(op));
        
        if (!logicalOperatorUsed) {
            throw new Error("No logical operator found. Only AND or OR can be used.");
        }
    
        // Ensure only one type of logical operator is used
        const otherLogicalOperator = logicalOperators.find(op => op !== logicalOperatorUsed);
        if (whereClause.includes(otherLogicalOperator)) {
            throw new Error("Mixing AND and OR operators is not allowed.");
        }
    
        // Split the whereClause by the detected logical operator
        const conditions = whereClause.split(new RegExp(logicalOperatorUsed, ''i'')).map(part => part.trim());
    
        // Parse the conditions
        const parsedConditions = conditions.map(condition => {
            // Find the operator in the condition
            let operator = operators.find(op => condition.includes(op));
    
            if (!operator) {
                throw new Error("Unsupported operator in condition: " + condition);
            }
    
            // Split the condition by the operator to get the field and value
            const [field, value] = condition.split(operator).map(part => part.trim());
    
            return {
                field,
                operator,
                value
            };
        });
    
        // Return the parsed conditions along with the logical operator used
        return {
            logicalOperator: logicalOperatorUsed.toUpperCase().trim(),
            conditions: parsedConditions
        };
    }
