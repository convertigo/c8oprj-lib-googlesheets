  comment: |
    '{
        "en": {
            "displayName": "<p>Update</p>",
            "comment": "Will be use only if the WHERE clause is not empty. Give here separated by commas the fields = value to define the columns to be updated by the given values. The fields must be the technical identifiers of the fields of your form. For example: <br><br><i>inputText1 = value1, inputText2 = value2</i>. <br><br>Of course values can be dragged and dropped from the list of fields."
        },
        "fr": {
            "displayName": "<p>Update</p>",
            "comment": "Sera utilisé uniquement si la clause WHERE n''est pas vide. Donnez ici séparés par des virgules les champs = valeur pour définir les colonnes à mettre à jour par les valeurs données. Les champs doivent être les identifiants techniques des champs de votre formulaire. Par exemple : <br><br><i>inputText1 = valeur1, inputText2 = valeur2</i><br><br>Bien entendu, les valeurs peuvent être glissées et déposées depuis la liste des champs."
        }
    }'
↓forms_where [variables.RequestableVariable-1724338055332]: 
  comment: |
    '{
        "en": {
            "displayName": "<p>WHERE Clause</p>",
            "comment": "If this field is not empty, the action will use the WHERE clause to filter the record to update. The WHERE clause must be a valid ''SQL like'' WHERE clause without the WHERE keyword. A Where clause can be for example : <br>inputText1 = ''value1'' AND inputText2 = ''value2''."
        },
        "fr": {
            "displayName": "<p>Clause Where</p>",
            "comment": "Si ce champ n''est pas vide, l''action utilisera la clause WHERE pour filtrer l''enregistrement à mettre à jour. La clause WHERE doit être une clause WHERE valide de type ''SQL'' sans le mot clé WHERE. Une clause Where peut être par exemple : <br>inputText1 = ''value1'' AND inputText2 = ''value2''"
        }
    }'
